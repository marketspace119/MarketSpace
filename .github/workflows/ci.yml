name: MarketSpace Security & CI Release Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-and-build-gate:
    name: Build, Static Typecheck & Forensic Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (Required for Firebase Local Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: TypeScript Typecheck (Zero Errors Allowed)
        run: npm run lint

      - name: Production Webpack/Vite Server Bundle Build
        run: npm run build

      - name: Run Deterministic Gap Closure Test Suite
        run: npx tsx tests/gap_closure_suite.ts

      - name: Run Strict Repair Regression Test Suite
        run: npx tsx tests/strict_final_repair_regression_suite.ts

      - name: Run AI Security & RBAC Policy Suite
        run: npx tsx tests/ai_security_suite.ts

      - name: Run Security Financial Audit Suite
        run: npx tsx tests/security_financial_audit.ts

      - name: Run E2E Forensic Invariant Test Suite
        run: npx tsx tests/e2e_forensic_invariant_suite.ts

      - name: Run Marketplace All Features Lifecycle Journeys Suite
        run: npx tsx tests/marketplace_all_features_verification_suite.ts

      - name: Run Marketplace Product Completeness Suite
        run: npx tsx tests/marketplace_completeness_suite.ts

      - name: Run Firebase Emulator Rules & Storage Integration Tests
        run: npm run test:integration

      - name: Run Adversarial Security Negative Test Suite
        run: npm run test:adversarial

      - name: Run Live Production Validation & Rules Suite
        run: npm run test:rules

      - name: Run Incremental Security Regression Suite
        run: npm run test:incremental

      - name: Run Image Content Security Suite
        run: npm run test:image

      - name: Run V3 Forensic Audit & Regression Suite
        run: npm run test:v3

      - name: Run Final Post-Closure Remediation Suite
        run: npm run test:remediation

      - name: Run Final Independent Closure Pass (F-01 to F-20)
        run: npx firebase emulators:exec --only firestore,storage "tsx tests/final_independent_closure_pass.ts"

      - name: Run Final Completion Forensic Suite (F-01 to F-35)
        run: npm run test:completion

      - name: Security Sign-Off Verification
        run: echo "CI Release Gate PASSED with 0 Critical, 0 High vulnerabilities."
